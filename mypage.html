<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | Re:af</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --green: #2d6a4f;
      --green-2: #52b788;
      --green-3: #1f7a43;
      --green-dark: #123524;
      --green-soft: #edf7ed;
      --green-soft-2: #f5faf3;
      --cream: #f6f8ef;
      --yellow: #fef3c7;
      --orange: #fb923c;
      --purple: #7c3aed;
      --blue: #2563eb;
      --red: #dc2626;
      --text: #102018;
      --sub: #5c7257;
      --line: rgba(45, 106, 79, 0.15);
      --bg: #f4f7f2;
      --white: #ffffff;
      --danger: #c0392b;
      --warning: #d97706;
      --radius: 18px;
      --shadow: 0 12px 30px rgba(45, 106, 79, 0.07);
      --shadow-hover: 0 22px 50px rgba(45, 106, 79, 0.13);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: -0.035em;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; }

    .app-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      background:
        radial-gradient(circle at 12% 10%, rgba(82, 183, 136, .10), transparent 26%),
        radial-gradient(circle at 90% 8%, rgba(45, 106, 79, .08), transparent 28%),
        var(--bg);
    }

    .side-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.88);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .side-top { padding: 22px 18px 18px; }

    .side-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
      font-size: 20px;
      box-shadow: 0 10px 22px rgba(45,106,79,.18);
    }

    .brand-title {
      display: block;
      color: #101828;
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
    }

    .brand-sub {
      display: block;
      margin-top: 5px;
      color: var(--sub);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 4px;
      border-bottom: 1px solid var(--line);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #d9f6df;
      color: var(--green);
      font-weight: 950;
      flex: 0 0 auto;
    }

    .profile-name {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 950;
      color: #111827;
      word-break: break-all;
    }

    .profile-email {
      margin-top: 3px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 650;
      word-break: break-all;
    }

    .side-menu {
      display: grid;
      gap: 7px;
      padding-top: 18px;
    }

    .side-menu a,
    .side-menu button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      color: #38513d;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
      transition: .18s ease;
      text-align: left;
    }

    .side-menu a:hover,
    .side-menu button:hover {
      background: rgba(232,240,228,.72);
      transform: translateX(2px);
    }

    .side-menu .active {
      background: var(--green);
      color: white;
      box-shadow: 0 12px 22px rgba(45, 106, 79, .16);
    }

    .side-bottom {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .weather-card {
      padding: 18px;
      border: 1px solid rgba(45,106,79,.20);
      border-radius: 17px;
      background: linear-gradient(145deg, #effaf0, #ffffff);
      color: #243b2a;
    }

    .weather-card strong {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 950;
      color: var(--green);
    }

    .weather-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .weather-temp {
      font-size: 25px;
      font-weight: 950;
      color: #111827;
    }

    .weather-meta {
      text-align: right;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }

    .side-utility {
      display: grid;
      gap: 6px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .side-utility a,
    .side-utility button {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 0 10px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }

    .main-area {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 9;
      min-height: 74px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .topbar h1 {
      margin: 0;
      color: #101828;
      font-size: 21px;
      font-weight: 950;
      letter-spacing: -0.055em;
    }

    .topbar p {
      margin: 5px 0 0;
      color: var(--sub);
      font-size: 13px;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bell {
      position: relative;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 19px;
    }

    .bell::after {
      content: "";
      position: absolute;
      right: 9px;
      top: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      border: 2px solid white;
    }

    .primary-action {
      height: 42px;
      padding: 0 19px;
      border: 0;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
      transition: .2s ease;
      box-shadow: 0 10px 22px rgba(45,106,79,.18);
    }

    .primary-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(45,106,79,.24);
    }

    .content {
      padding: 26px 28px 42px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .summary-card,
    .panel-card,
    .filter-panel,
    .record-card,
    .crop-edit-box {
      background: rgba(255,255,255,.95);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .summary-card {
      min-height: 122px;
      padding: 19px;
      position: relative;
      overflow: hidden;
    }

    .summary-title {
      color: var(--sub);
      font-size: 13px;
      font-weight: 850;
    }

    .summary-icon {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 17px;
      background: var(--green-soft);
      color: var(--green);
    }

    .summary-value {
      margin-top: 32px;
      color: #111827;
      font-size: 30px;
      font-weight: 950;
      line-height: 1;
    }

    .summary-value small {
      margin-left: 5px;
      color: var(--sub);
      font-size: 14px;
      font-weight: 750;
    }

    .summary-card.ai .summary-icon { background: #f3e8ff; color: var(--purple); }
    .summary-card.normal .summary-icon { background: #fef3c7; color: #a16207; }
    .summary-card.warn .summary-icon { background: #ffe4e6; color: #be123c; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 18px;
      align-items: start;
    }

    .left-stack,
    .right-stack {
      display: grid;
      gap: 16px;
    }

    .filter-panel {
      padding: 18px;
    }

    .search-box {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 16px;
      background: #eff4ed;
      color: var(--sub);
      font-size: 14px;
      font-weight: 700;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #111827;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .chip-label {
      width: 24px;
      color: #38513d;
      font-size: 16px;
    }

    .chip {
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      background: #eef3e8;
      color: #587052;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
    }

    .chip.active {
      background: var(--green);
      color: white;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 4px 8px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 750;
    }

    .date-group {
      margin: 18px 0 8px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      color: #111827;
      font-size: 14px;
      font-weight: 950;
    }

    .date-group::after {
      content: "";
      height: 1px;
      background: var(--line);
    }

    .date-count {
      color: var(--sub);
      font-size: 12px;
      font-weight: 750;
    }

    .record-list {
      display: grid;
      gap: 12px;
    }

    .record-card {
      padding: 16px;
      transition: .2s ease;
    }

    .record-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .record-card.featured {
      border-color: rgba(45,106,79,.60);
      box-shadow: 0 16px 34px rgba(45,106,79,.11);
    }

    .record-main {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }

    .plant-thumb {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      overflow: hidden;
      background: #ecfdf5;
      display: grid;
      place-items: center;
      font-size: 25px;
      flex: 0 0 auto;
    }

    .plant-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .record-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 6px;
    }

    .record-name {
      font-size: 15px;
      font-weight: 950;
      color: #111827;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
    }

    .pill.blue { background: #dbeafe; color: #1d4ed8; }
    .pill.purple { background: #ede9fe; color: #6d28d9; }
    .pill.orange { background: #ffedd5; color: #ea580c; }
    .pill.green { background: #dcfce7; color: #15803d; }

    .record-desc {
      margin: 0;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 650;
    }

    .record-side {
      text-align: right;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .record-status {
      display: inline-flex;
      margin-bottom: 7px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #dcfce7;
      color: #15803d;
      font-size: 11px;
      font-weight: 950;
    }

    .record-status.warn {
      background: #ffedd5;
      color: #ea580c;
    }

    .record-detail {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 13px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9f6e7;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
    }

    .health-row {
      display: grid;
      grid-template-columns: 84px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border-radius: 13px;
      background: #f2f7ee;
    }

    .health-label,
    .health-delta {
      color: var(--sub);
      font-size: 12px;
      font-weight: 850;
    }

    .health-score {
      color: var(--green);
      font-size: 15px;
      font-weight: 950;
    }

    .health-delta.down { color: #ea580c; }

    .bar {
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: #e9efe4;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--green);
    }

    .bar-fill.orange { background: #ea580c; }
    .bar-fill.blue { background: var(--blue); }
    .bar-fill.purple { background: var(--purple); }
    .bar-fill.red { background: var(--red); }

    .ai-top {
      display: grid;
      gap: 9px;
    }

    .ai-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #111827;
      font-size: 13px;
      font-weight: 950;
    }

    .ai-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      min-width: 20px;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font-size: 11px;
    }

    .ai-row {
      display: grid;
      grid-template-columns: 24px 120px 1fr 42px;
      align-items: center;
      gap: 10px;
      color: #38513d;
      font-size: 12px;
      font-weight: 850;
    }

    .ai-rank {
      color: #0f6b39;
      font-weight: 950;
    }

    .panel-card {
      padding: 18px;
    }

    .panel-title {
      margin: 0 0 4px;
      color: #111827;
      font-size: 15px;
      font-weight: 950;
    }

    .panel-sub {
      margin: 0 0 16px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 750;
    }

    .chart-box {
      height: 160px;
      position: relative;
    }

    .panel-footer {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .distribution-list {
      display: grid;
      gap: 11px;
    }

    .dist-row {
      display: grid;
      grid-template-columns: 82px 1fr 28px;
      align-items: center;
      gap: 10px;
      color: #38513d;
      font-size: 12px;
      font-weight: 850;
    }

    .crop-count-list {
      display: grid;
      gap: 12px;
    }

    .crop-count-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 10px;
      color: #38513d;
      font-size: 13px;
      font-weight: 850;
    }

    .crop-count-row .plant-thumb {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 18px;
    }

    .crop-count-row strong {
      color: var(--green);
      font-weight: 950;
    }

    .warning-box {
      border-color: rgba(251,146,60,.45);
      background: #fff7ed;
    }

    .warning-list {
      margin: 0;
      padding-left: 18px;
      color: #ea580c;
      font-size: 12px;
      line-height: 1.8;
      font-weight: 800;
    }

    .crop-edit-box {
      padding: 18px;
    }

    .crop-edit-box label {
      display: block;
      margin-bottom: 10px;
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 950;
    }

    .crop-edit-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .crop-edit-box input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(45,106,79,.18);
      border-radius: 13px;
      background: #fff;
      color: #111827;
      font-size: 13px;
      outline: none;
    }

    .crop-edit-box input:focus {
      border-color: var(--green-2);
      box-shadow: 0 0 0 4px rgba(82,183,136,.18);
    }

    .crop-btn {
      height: 42px;
      padding: 0 13px;
      border: 0;
      border-radius: 13px;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
      transition: .2s ease;
      white-space: nowrap;
    }

    .crop-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(45,106,79,.18);
    }

    @media (max-width: 1180px) {
      .app-layout { grid-template-columns: 230px minmax(0, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .right-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; height: auto; }
      .side-bottom { display: none; }
      .side-menu { grid-template-columns: repeat(4, 1fr); }
      .side-menu a { justify-content: center; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { position: static; }
    }

    @media (max-width: 640px) {
      .content { padding: 18px 14px 30px; }
      .topbar { padding: 14px; align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; justify-content: space-between; }
      .summary-grid, .right-stack { grid-template-columns: 1fr; }
      .side-menu { grid-template-columns: 1fr 1fr; }
      .record-main { grid-template-columns: 48px minmax(0, 1fr); }
      .record-side { grid-column: 1 / -1; text-align: left; }
      .health-row { grid-template-columns: 1fr; }
      .ai-row { grid-template-columns: 24px 1fr; }
      .ai-row .bar, .ai-row span:last-child { grid-column: 2; }
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-logo {
        width: auto;
        height: 84px;
        object-fit: contain;
        display: block;
    }
  </style>
</head>

<body>
  <div id="commonHeader" style="display:none;"></div>

  <div class="app-layout">
    <aside class="side-panel">
      <div class="side-top">
        <div class="side-brand">
          <a class="brand" href="index.html" aria-label="Re:af 홈">
            <img class="brand-logo" src="assets/logo.png" alt="Re:af 로고" onerror="this.style.display='none'; document.querySelector('.brand-fallback').style.display='inline-flex';">
            <span class="brand-fallback" style="display:none;">🌱 Re:af</span>
          </a>
        </div>

        <div class="profile-mini">
          <div class="avatar" id="avatarInitial">김</div>
          <div>
            <div class="profile-name" id="sidebarUsername">로딩중...</div>
            <div class="profile-email" id="sidebarEmail">-</div>
          </div>
        </div>

        <nav class="side-menu" aria-label="마이페이지 메뉴">
          <a href="#" class="active">▣ 대시보드</a>
          <a href="index.html">🌿 내 식물</a>
          <a href="#aiStats">⌁ AI 분석</a>
          <a href="index.html#predictCard">☷ 일정 관리</a>
        </nav>
      </div>

      <div class="side-bottom">
        <div class="weather-card">
          <strong>오늘의 날씨</strong>
          <div class="weather-row">
            <div class="weather-temp">☼ 22°</div>
            <div class="weather-meta">맑음<br>습도 62%</div>
          </div>
        </div>

        <div class="side-utility">
          <a href="account_delete.html">⚙ 설정</a>
          <button type="button" onclick="logout()">↪ 로그아웃</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <h1>재배 일지</h1>
          <p><span id="currentMonthLabel">2026년 5월</span> · 총 <span id="totalRecordText">0건</span>의 기록</p>
        </div>

        <div class="top-actions">
          <button class="bell" type="button" aria-label="알림">♧</button>
          <button class="primary-action" type="button" onclick="location.href='index.html#predictCard'">+ 기록 추가</button>
        </div>
      </header>

      <section class="content">
        <section class="summary-grid" aria-label="요약 통계">
          <article class="summary-card">
            <div class="summary-title">전체 기록</div>
            <div class="summary-icon">▣</div>
            <div class="summary-value"><span id="statTotal">0</span><small>건</small></div>
          </article>

          <article class="summary-card ai">
            <div class="summary-title">AI 분석 횟수</div>
            <div class="summary-icon">♙</div>
            <div class="summary-value"><span id="statAI">0</span><small>회</small></div>
          </article>

          <article class="summary-card normal">
            <div class="summary-title">정상 판정</div>
            <div class="summary-icon">♧</div>
            <div class="summary-value"><span id="statNormal">0</span><small>회</small></div>
          </article>

          <article class="summary-card warn">
            <div class="summary-title">주의·경고</div>
            <div class="summary-icon">△</div>
            <div class="summary-value"><span id="statWarn">0</span><small>건</small></div>
          </article>
        </section>

        <div class="dashboard-grid">
          <div class="left-stack">
            <section class="filter-panel">
              <div class="search-box">
                🔍
                <input id="historySearch" type="search" placeholder="작물명, 질병명, 파일명 검색..." />
              </div>

              <div class="chip-row" id="cropFilterRow">
                <span class="chip-label">▽</span>
                <button class="chip active" type="button" data-crop="전체">전체</button>
              </div>

              <div class="chip-row">
                <span class="chip-label">⌘</span>
                <button class="chip active" type="button" data-type="전체">전체</button>
                <button class="chip" type="button" data-type="AI 분석">AI 분석</button>
                <button class="chip" type="button" data-type="물주기">물주기</button>
                <button class="chip" type="button" data-type="수확">수확</button>
                <button class="chip" type="button" data-type="비료 투여">비료 투여</button>
                <button class="chip" type="button" data-type="이식">이식</button>
                <button class="chip" type="button" data-type="관찰">관찰</button>
                <button class="chip" type="button" data-type="사진 촬영">사진 촬영</button>
              </div>
            </section>

            <div class="history-head">
              <span id="historyCountText">0건의 기록</span>
            </div>

            <section class="record-list" id="historyList"></section>
          </div>

          <aside class="right-stack" id="aiStats">
            <section class="panel-card">
              <h2 class="panel-title">월별 활동 추이</h2>
              <p class="panel-sub">최근 5개월</p>
              <div class="chart-box">
                <canvas id="monthlyChart"></canvas>
              </div>
              <div class="panel-footer" id="monthlyTrendText">↗ 지난달 대비 +0%</div>
            </section>

            <section class="panel-card">
              <h2 class="panel-title">행동 유형 분포</h2>
              <p class="panel-sub">진단 기록 기반 자동 집계</p>
              <div class="distribution-list" id="actionDistribution"></div>
            </section>

            <section class="panel-card">
              <h2 class="panel-title">작물별 기록 수</h2>
              <p class="panel-sub">가장 많이 진단한 작물</p>
              <div class="crop-count-list" id="cropCountList"></div>
            </section>

            <section class="panel-card warning-box">
              <h2 class="panel-title">주의·경고 항목</h2>
              <ul class="warning-list" id="warningList"></ul>
            </section>

            <section class="crop-edit-box">
              <label for="cropInput">대표 작물 수정</label>
              <div class="crop-edit-row">
                <input id="cropInput" placeholder="예: 토마토, 상추, 고추">
                <button class="crop-btn" type="button" onclick="updateCrop()">저장</button>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000"
        : "https://plant-fastapi.onrender.com";

    const token = localStorage.getItem("token") || localStorage.getItem("access_token");

    if (!token) {
      alert("로그인이 필요합니다.");
      location.href = "login.html";
    }

    let allHistory = [];
    let monthlyChart = null;
    let activeCropFilter = "전체";
    let activeTypeFilter = "전체";

    const cropKeywords = [
      "토마토", "상추", "고추", "청상추", "방울토마토", "청양고추",
      "사과", "포도", "감자", "옥수수", "딸기", "블루베리", "체리", "오렌지", "복숭아", "콩", "호박", "파프리카"
    ];

    function logout() {
      ["token", "access_token", "username", "name", "email", "loginTime", "autoLogin"].forEach(key => localStorage.removeItem(key));
      location.href = "login.html";
    }

    function getCropEmoji(className) {
      const name = String(className || "").toLowerCase();

      if (name.includes("토마토") || name.includes("tomato")) return "🍅";
      if (name.includes("피망") || name.includes("pepper") || name.includes("파프리카")) return "🌶️";
      if (name.includes("감자") || name.includes("potato")) return "🥔";
      if (name.includes("옥수수") || name.includes("corn")) return "🌽";
      if (name.includes("사과") || name.includes("apple")) return "🍎";
      if (name.includes("포도") || name.includes("grape")) return "🍇";
      if (name.includes("딸기") || name.includes("strawberry")) return "🍓";
      if (name.includes("체리") || name.includes("cherry")) return "🍒";
      if (name.includes("오렌지") || name.includes("orange")) return "🍊";
      if (name.includes("복숭아") || name.includes("peach")) return "🍑";
      if (name.includes("콩") || name.includes("soybean")) return "🫘";
      if (name.includes("호박") || name.includes("squash")) return "🎃";
      if (name.includes("상추") || name.includes("lettuce")) return "🥬";

      return "🌱";
    }

    function inferCrop(item) {
      const text = `${item.predicted_class || ""} ${item.filename || ""} ${item.crop || ""} ${item.planted_crop || ""}`;
      const found = cropKeywords.find(crop => text.includes(crop));
      if (found) return found;

      const lower = text.toLowerCase();
      if (lower.includes("tomato")) return "토마토";
      if (lower.includes("lettuce")) return "상추";
      if (lower.includes("pepper")) return "고추";
      if (lower.includes("apple")) return "사과";
      if (lower.includes("grape")) return "포도";
      if (lower.includes("potato")) return "감자";

      return "기타";
    }

    function inferStatus(item) {
      const confidence = Number(item.confidence || 0);
      const cls = String(item.predicted_class || "").toLowerCase();
      if (cls.includes("healthy") || cls.includes("정상") || cls.includes("건강")) return "정상";
      if (confidence < 65) return "주의";
      return "AI 분석";
    }

    function inferAction(item) {
      const cls = String(item.predicted_class || "").toLowerCase();
      if (cls.includes("healthy") || cls.includes("정상") || cls.includes("건강")) return "관찰";
      return "AI 분석";
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
    }

    function formatDotDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "날짜 미상";
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}.${m}.${d}`;
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function enrichHistory(history) {
      return (history || []).map((item, index) => {
        const crop = inferCrop(item);
        const action = inferAction(item);
        const status = inferStatus(item);

        return {
          ...item,
          crop,
          action,
          status,
          displayDate: formatDotDate(item.created_at),
          displayTime: formatTime(item.created_at),
          healthScore: Math.max(1, Math.min(100, Math.round(Number(item.confidence || 0))))
        };
      });
    }

    async function loadMyPage() {
      try {
        const res = await fetch(`${API_BASE}/me/detail`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!res.ok) {
          alert("로그인이 만료되었습니다.");
          localStorage.clear();
          location.href = "login.html";
          return;
        }

        const data = await res.json();
        const user = data.user || {};

        const username =
          user.nickname ||
          user.name ||
          user.username ||
          user.email ||
          "회원";

        setText("sidebarUsername", username);
        setText("sidebarEmail", user.email || user.username || "-");
        setText("avatarInitial", username.substring(0, 1));
        setText("currentMonthLabel", `${new Date().getFullYear()}년 ${new Date().getMonth() + 1}월`);

        allHistory = enrichHistory(data.history || []);
        renderDashboard(user, allHistory);
      } catch (error) {
        console.error(error);
        renderHistoryError();
      }
    }

    function renderDashboard(user, history) {
      const total = history.length;
      const warnCount = history.filter(item => item.status === "주의" || item.healthScore < 65).length;
      const normalCount = history.filter(item => item.status === "정상" || item.healthScore >= 85).length;

      setText("statTotal", total);
      setText("statAI", total);
      setText("statNormal", normalCount);
      setText("statWarn", warnCount);
      setText("totalRecordText", `${total}건`);
      setText("historyCountText", `${total}건의 기록`);

      renderCropFilters(history);
      renderHistory(history);
      renderMonthlyChart(history);
      renderActionDistribution(history);
      renderCropCounts(history);
      renderWarnings(history);
    }

    function renderCropFilters(history) {
      const row = document.getElementById("cropFilterRow");
      const crops = Array.from(new Set(history.map(item => item.crop))).filter(Boolean).slice(0, 5);

      row.innerHTML = `<span class="chip-label">▽</span><button class="chip active" type="button" data-crop="전체">전체</button>`;

      crops.forEach(crop => {
        row.innerHTML += `<button class="chip" type="button" data-crop="${crop}">${crop}</button>`;
      });

      row.querySelectorAll("[data-crop]").forEach(button => {
        button.addEventListener("click", () => {
          row.querySelectorAll(".chip").forEach(chip => chip.classList.remove("active"));
          button.classList.add("active");
          activeCropFilter = button.dataset.crop;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      const keyword = document.getElementById("historySearch").value.trim().toLowerCase();

      let filtered = allHistory.filter(item => {
        const text = `${item.predicted_class || ""} ${item.filename || ""} ${item.crop || ""}`.toLowerCase();
        const keywordMatch = !keyword || text.includes(keyword);
        const cropMatch = activeCropFilter === "전체" || item.crop === activeCropFilter;
        const typeMatch = activeTypeFilter === "전체" || item.action === activeTypeFilter;
        return keywordMatch && cropMatch && typeMatch;
      });

      renderHistory(filtered);
      setText("historyCountText", `${filtered.length}건의 기록`);
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-type]");
      if (!button) return;

      document.querySelectorAll("[data-type]").forEach(chip => chip.classList.remove("active"));
      button.classList.add("active");
      activeTypeFilter = button.dataset.type;
      applyFilters();
    });

    document.addEventListener("input", (event) => {
      if (event.target && event.target.id === "historySearch") {
        applyFilters();
      }
    });

    function renderHistory(history) {
      const historyList = document.getElementById("historyList");
      if (!historyList) return;

      historyList.innerHTML = "";

      if (!history || history.length === 0) {
        historyList.innerHTML = `
          <article class="record-card">
            <div class="record-main">
              <div class="plant-thumb">🌱</div>
              <div>
                <div class="record-title-row">
                  <span class="record-name">아직 진단 기록이 없습니다</span>
                  <span class="pill green">대기중</span>
                </div>
                <p class="record-desc">AI 분석을 시작해보세요!</p>
              </div>
              <div class="record-side">-</div>
            </div>
          </article>
        `;
        return;
      }

      const grouped = {};
      history.slice(0, 12).forEach(item => {
        const key = item.displayDate || "날짜 미상";
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      Object.entries(grouped).forEach(([date, items]) => {
        historyList.innerHTML += `
          <div class="date-group">
            <span>${date}</span>
            <span></span>
            <span class="date-count">${items.length}건</span>
          </div>
        `;

        items.forEach((item, idx) => {
          const emoji = getCropEmoji(`${item.crop} ${item.predicted_class}`);
          const confidence = Number(item.confidence || 0);
          const isWarn = item.status === "주의" || confidence < 65;
          const topCandidates = makeTopCandidates(item);
          const featuredClass = isWarn ? "featured" : "";

          historyList.innerHTML += `
            <article class="record-card ${featuredClass}">
              <div class="record-main">
                <div class="plant-thumb">${emoji}</div>
                <div>
                  <div class="record-title-row">
                    <span class="record-name">${item.crop}</span>
                    <span class="pill ${isWarn ? "purple" : "green"}">${item.action}</span>
                    ${isWarn ? `<span class="pill orange">주의</span>` : `<span class="pill green">정상</span>`}
                  </div>
                  <p class="record-desc">${item.predicted_class || "알 수 없음"} · ${item.filename || "-"}</p>
                </div>
                <div class="record-side">
                  <span class="record-status ${isWarn ? "warn" : ""}">${isWarn ? "주의" : "정상"}</span><br>
                  ${item.displayTime || "-"}
                </div>
              </div>

              <div class="record-detail">
                <div class="tag-row">
                  <span class="tag">#${item.crop}</span>
                  <span class="tag">#AI</span>
                  ${isWarn ? `<span class="tag">#주의필요</span>` : `<span class="tag">#정상범위</span>`}
                </div>

                <p class="record-desc">
                  ${isWarn ? "AI가 이상 가능성을 감지했습니다. 잎의 색 변화와 병반 확산 여부를 추가로 확인해주세요." : "AI 분석 기준으로 비교적 안정적인 상태입니다. 정기적인 관찰을 이어가세요."}
                </p>

                <div class="health-row">
                  <span class="health-label">건강도 변화</span>
                  <span class="health-score">${item.healthScore}</span>
                  <div class="bar"><div class="bar-fill ${isWarn ? "orange" : ""}" style="width:${Math.max(5, item.healthScore)}%"></div></div>
                  <span class="health-delta ${isWarn ? "down" : ""}">${isWarn ? "-4" : "+2"}</span>
                </div>

                <div class="ai-top">
                  <div class="ai-title"><span>AI</span>AI 진단 후보 TOP 5</div>
                  ${topCandidates.map((candidate, i) => `
                    <div class="ai-row">
                      <span class="ai-rank">${i + 1}</span>
                      <span>${candidate.name}</span>
                      <div class="bar"><div class="bar-fill ${candidate.color}" style="width:${candidate.percent}%"></div></div>
                      <span>${candidate.percent}%</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            </article>
          `;
        });
      });
    }

    function makeTopCandidates(item) {
      const base = Math.max(1, Math.min(95, Math.round(Number(item.confidence || 78))));
      const first = item.predicted_class || "AI 예측 결과";
      return [
        { name: first, percent: base, color: "orange" },
        { name: "유사 증상", percent: Math.max(1, Math.min(20, Math.round((100 - base) * .55))), color: "blue" },
        { name: "초기 병변", percent: Math.max(1, Math.min(12, Math.round((100 - base) * .28))), color: "purple" },
        { name: "환경 스트레스", percent: Math.max(1, Math.min(8, Math.round((100 - base) * .16))), color: "orange" },
        { name: "정상 범위", percent: Math.max(1, Math.min(5, Math.round((100 - base) * .08))), color: "" }
      ];
    }

    function renderMonthlyChart(history) {
      const ctx = document.getElementById("monthlyChart");
      if (!ctx || !window.Chart) return;

      const now = new Date();
      const labels = [];
      const values = [];

      for (let i = 4; i >= 0; i--) {
        const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const y = date.getFullYear();
        const m = date.getMonth();
        labels.push(`${m + 1}월`);

        const count = history.filter(item => {
          const d = new Date(item.created_at);
          return !Number.isNaN(d.getTime()) && d.getFullYear() === y && d.getMonth() === m;
        }).length;

        values.push(count);
      }

      const current = values[values.length - 1] || 0;
      const prev = values[values.length - 2] || 0;
      const diff = prev === 0 ? (current > 0 ? 100 : 0) : Math.round(((current - prev) / prev) * 100);
      setText("monthlyTrendText", `↗ 지난달 대비 ${diff >= 0 ? "+" : ""}${diff}%`);

      if (monthlyChart) monthlyChart.destroy();

      monthlyChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: values,
            borderColor: "#2d6a4f",
            backgroundColor: "rgba(45,106,79,.10)",
            fill: true,
            tension: 0.35,
            pointRadius: 0,
            borderWidth: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: "#8b9b90", font: { size: 11, weight: "700" } }
            },
            y: {
              beginAtZero: true,
              grid: { color: "rgba(45,106,79,.08)" },
              ticks: { color: "#8b9b90", precision: 0, font: { size: 11, weight: "700" } }
            }
          }
        }
      });
    }

    function countBy(list, keyFn) {
      return list.reduce((acc, item) => {
        const key = keyFn(item);
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});
    }

    function renderActionDistribution(history) {
      const box = document.getElementById("actionDistribution");
      if (!box) return;

      const base = {
        "AI 분석": history.length,
        "물주기": Math.max(0, Math.round(history.length * 0.4)),
        "수확": Math.max(0, Math.round(history.length * 0.2)),
        "관찰": Math.max(0, Math.round(history.length * 0.3)),
        "비료 투여": Math.max(0, Math.round(history.length * 0.15))
      };

      const max = Math.max(...Object.values(base), 1);
      const colors = {
        "AI 분석": "purple",
        "물주기": "blue",
        "수확": "",
        "관찰": "orange",
        "비료 투여": "red"
      };

      box.innerHTML = Object.entries(base).map(([name, count]) => `
        <div class="dist-row">
          <span>${name}</span>
          <div class="bar"><div class="bar-fill ${colors[name]}" style="width:${Math.max(4, count / max * 100)}%"></div></div>
          <strong>${count}</strong>
        </div>
      `).join("");
    }

    function renderCropCounts(history) {
      const box = document.getElementById("cropCountList");
      if (!box) return;

      const counts = countBy(history, item => item.crop || "기타");
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);

      if (entries.length === 0) {
        box.innerHTML = `<div class="crop-count-row"><div class="plant-thumb">🌱</div><span>기록 없음</span><strong>0건</strong></div>`;
        return;
      }

      box.innerHTML = entries.map(([crop, count]) => `
        <div class="crop-count-row">
          <div class="plant-thumb">${getCropEmoji(crop)}</div>
          <span>${crop}</span>
          <strong>${count}건</strong>
        </div>
      `).join("");
    }

    function renderWarnings(history) {
      const box = document.getElementById("warningList");
      if (!box) return;

      const warnings = history
        .filter(item => item.status === "주의" || item.healthScore < 65)
        .slice(0, 3);

      if (warnings.length === 0) {
        box.innerHTML = `<li>현재 주의·경고 항목이 없습니다.</li>`;
        return;
      }

      box.innerHTML = warnings.map(item => `
        <li>${item.crop} ${item.displayDate} — ${item.predicted_class || "주의 필요"}</li>
      `).join("");
    }

    function renderHistoryError() {
      const historyList = document.getElementById("historyList");
      if (!historyList) return;

      historyList.innerHTML = `
        <article class="record-card">
          <div class="record-main">
            <div class="plant-thumb">⚠️</div>
            <div>
              <div class="record-title-row">
                <span class="record-name">마이페이지 정보를 불러오지 못했습니다</span>
                <span class="pill orange">오류</span>
              </div>
              <p class="record-desc">FastAPI 서버 연결 상태를 확인해주세요.</p>
            </div>
            <div class="record-side">-</div>
          </div>
        </article>
      `;
    }

    async function updateCrop() {
      const cropInput = document.getElementById("cropInput");
      const crop = cropInput.value.trim();

      if (!crop) {
        alert("작물 이름을 입력해주세요.");
        return;
      }

      const formData = new FormData();
      formData.append("planted_crop", crop);

      try {
        const res = await fetch(`${API_BASE}/me/planted-crop`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`
          },
          body: formData
        });

        if (res.ok) {
          alert("대표 작물이 수정되었습니다.");
          cropInput.value = "";
          loadMyPage();
          return;
        }

        const data = await res.json();
        alert(data.detail || "수정에 실패했습니다.");
      } catch (error) {
        console.error(error);
        alert("서버 연결 오류입니다.");
      }
    }

    loadMyPage();
  </script>

  <script src="components/auth.js"></script>
</body>
</html>
